<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso | FISI Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="pagina-login">

  <!-- Navbar Institucional Unificado -->
  <header class="main-navbar">
    <div class="container nav-wrapper">
        <div class="nav-brand">
            <img src="assets/img/logo.png" alt="Logo FISI" width="45" height="45">
            <h1>FISI Events</h1>
        </div>
        <div class="nav-auth-area">
            <ul id="nav-links" class="auth-guest">
                <li><a href="index.html">Catálogo</a></li>
                <li><a href="login.html" id="login-link" class="btn-login">Iniciar Sesión</a></li>
            </ul>
        </div>
    </div>
  </header>

  <main class="login-main">
    <div class="login-card">
      <!-- Botonera de pestañas -->
      <div class="login-tabs">
        <button class="login-tab login-tab--activo" id="tab-login" type="button" data-tab="login">
          Iniciar Sesión
        </button>
        <button class="login-tab" id="tab-registro" type="button" data-tab="registro">
          Registrarse
        </button>
      </div>

      <!-- PANEL 1: INICIO DE SESIÓN -->
      <div class="login-panel" id="panel-login">
        <form id="form-login" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-username">Nombre de usuario</label>
            <input class="form-input" type="text" id="login-username" name="username" placeholder="Ej. juan.perez" required />
            <span class="form-error" id="login-username-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Contraseña</label>
            <div class="input-password-wrapper">
              <input class="form-input" type="password" id="login-password" name="password" placeholder="••••••••" required />
              <button type="button" class="input-password-toggle" data-target="login-password">👁</button>
            </div>
            <span class="form-error" id="login-password-error"></span>
          </div>
          <button class="btn-login-submit" type="submit" id="btn-login">
            <span class="btn-texto">Iniciar Sesión</span>
          </button>
        </form>
      </div>

      <!-- PANEL 2: REGISTRO -->
      <div class="login-panel login-panel--oculto" id="panel-registro" hidden>
        <form id="form-registro" novalidate>
          <fieldset class="form-fieldset">
            <legend class="form-legend">Datos personales</legend>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="reg-nombres">Nombres *</label>
                <input class="form-input" type="text" id="reg-nombres" name="firstName" placeholder="Ej. María José" required />
                <span class="form-error" id="reg-nombres-error"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="reg-apellidos">Apellidos *</label>
                <input class="form-input" type="text" id="reg-apellidos" name="lastName" placeholder="Ej. Quispe Flores" required />
                <span class="form-error" id="reg-apellidos-error"></span>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-username">Crea tu Nombre de Usuario *</label>
              <input class="form-input" type="text" id="reg-username" name="username" placeholder="Ej. maria.quispe" required />
              <span class="form-error" id="reg-username-error"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-password">Contraseña *</label>
              <div class="input-password-wrapper">
                <input class="form-input" type="password" id="reg-password" name="password" placeholder="Mínimo 8 caracteres" required />
                <button type="button" class="input-password-toggle" data-target="reg-password">👁</button>
              </div>
              <span class="form-error" id="reg-password-error"></span>
            </div>
          </fieldset>

          <fieldset class="form-fieldset">
            <legend class="form-legend">Tipo de cuenta</legend>
            <div class="rol-selector">
              <label class="rol-opcion">
                <input type="radio" name="role" value="alumno" id="rol-alumno" class="rol-radio" checked required />
                <span class="rol-opcion-card">
                  <span class="rol-icono">🎓</span>
                  <span class="rol-nombre">Alumno</span>
                </span>
              </label>
              <label class="rol-opcion">
                <input type="radio" name="role" value="organizador" id="rol-organizador" class="rol-radio" required />
                <span class="rol-opcion-card">
                  <span class="rol-icono">⚙️</span>
                  <span class="rol-nombre">Organizador</span>
                </span>
              </label>
            </div>
          </fieldset>

          <!-- CONDICIONAL: ALUMNO -->
          <fieldset class="form-fieldset" id="bloque-alumno">
            <legend class="form-legend">Datos de estudiante</legend>
            <div class="form-group">
              <label class="form-label" for="reg-codigo">Código de estudiante *</label>
              <input class="form-input" type="text" id="reg-codigo" name="studentCode" placeholder="Ej. 22200010" maxlength="10" />
              <span class="form-error" id="reg-codigo-error"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-carrera">Carrera / Escuela *</label>
              <select class="form-input form-select" id="reg-carrera" name="career">
                <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                <option value="Ingeniería de Software">Ingeniería de Software</option>
                <option value="Ciencias de la Computación">Ciencias de la Computación</option>
              </select>
            </div>
          </fieldset>

          <!-- CONDICIONAL: ORGANIZADOR -->
          <fieldset class="form-fieldset hidden" id="bloque-organizador" hidden>
            <legend class="form-legend">Datos de organización</legend>
            <div class="form-group">
              <label class="form-label" for="reg-nombre-grupo">Nombre del Círculo / Docente *</label>
              <input class="form-input" type="text" id="reg-nombre-grupo" name="groupName" placeholder="Ej. Círculo de IA FISI" />
              <span class="form-error" id="reg-grupo-error"></span>
            </div>
          </fieldset>

          <button class="btn-login-submit" type="submit" id="btn-registro">
            <span class="btn-texto">Crear cuenta</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { registrar, iniciarSesion, redirigirPorRol } from './js/modules/auth.js';

    const tabs = document.querySelectorAll('.login-tab');
    const panelLogin = document.getElementById('panel-login');
    const panelRegistro = document.getElementById('panel-registro');
    const formLogin = document.getElementById('form-login');
    const formRegistro = document.getElementById('form-registro');
    const radioRoles = document.querySelectorAll('input[name="role"]');
    const bloqueAlumno = document.getElementById('bloque-alumno');
    const bloqueOrg = document.getElementById('bloque-organizador');

    function activarTab(nombreTab) {
      const esLogin = nombreTab === 'login';
      tabs.forEach(tab => tab.classList.toggle('login-tab--activo', tab.dataset.tab === nombreTab));
      panelLogin.hidden = !esLogin;
      panelRegistro.hidden = esLogin;
      panelLogin.classList.toggle('login-panel--oculto', !esLogin);
      panelRegistro.classList.toggle('login-panel--oculto', esLogin);
    }

    tabs.forEach(tab => tab.addEventListener('click', () => activarTab(tab.dataset.tab)));

    radioRoles.forEach(r => r.addEventListener('change', () => {
      const esAlumno = document.getElementById('rol-alumno').checked;
      bloqueAlumno.classList.toggle('hidden', !esAlumno);
      bloqueAlumno.hidden = !esAlumno;
      bloqueOrg.classList.toggle('hidden', esAlumno);
      bloqueOrg.hidden = esAlumno;
    }));

    document.querySelectorAll('.input-password-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value;
      const res = await iniciarSesion(username, pass);
      if (res.exito) redirigirPorRol(res.role);
    });

    formRegistro.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const rol = document.querySelector('input[name="role"]:checked').value;
      
      const formData = {
        firstName: document.getElementById('reg-nombres').value.trim(),
        lastName: document.getElementById('reg-apellidos').value.trim(),
        role: rol,
        studentCode: document.getElementById('reg-codigo').value.trim(),
        groupName: document.getElementById('reg-nombre-grupo').value.trim()
      };

      const res = await registrar(username, password, formData);
      if (res.exito) redirigirPorRol(rol);
    });
  </script>
</body>
</html>
