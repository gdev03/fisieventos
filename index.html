<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Eventos - FISI Events</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/catalog.css">
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>
    <header class="main-navbar">
        <div class="container nav-wrapper">
            <div class="nav-brand">
                <img src="assets/img/logo.png" alt="Logo FISI" width="45" height="45">
                <h1>FISI Events</h1>
            </div>
            <div class="nav-auth-area">
                <ul id="nav-links" class="auth-guest">
                    <li><a href="index.html" class="active">Catálogo</a></li>
                    <li><a href="login.html" id="login-link" class="btn-login">Iniciar Sesión</a></li>
                </ul>
            </div>
        </div>
    </header>

    <section class="search-filters-section">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar evento por nombre..." autocomplete="off">
        </div>
        <div class="filters-container">
            <button class="filter-btn" data-category="charla">Charlas</button>
            <button class="filter-btn" data-category="taller">Talleres</button>
            <button class="filter-btn" data-category="seminario">Seminarios</button>
            <button class="filter-btn" data-category="congreso">Congresos</button>
        </div>
    </section>

    <main class="catalog-layout">

        <section class="catalog-grid" id="events-container">
 
</section>

        <aside class="calendar-sidebar">
            <div class="calendar-header">
                <h3 id="calendar-month-year">Mes Actual</h3>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                </div>
        </aside>
    </main>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/utils/calendar-render.js"></script>
    <script type="module" src="js/utils/catalog-render.js"></script>

</body>
</html>
